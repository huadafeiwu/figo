name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    # Only run on pushes to main, skip for PRs
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update snapshots
        run: INSTA_UPDATE=always cargo test --lib
        continue-on-error: true

      - name: Accept new snapshots
        run: cargo insta accept
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated snapshots
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: auto-update snapshots"
          git push

  build:
    needs: update-snapshots
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: figo-x86_64-pc-windows-msvc
            binary: figo.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: figo-x86_64-unknown-linux-gnu
            binary: figo

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
